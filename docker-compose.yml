services:
  opencode2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/samson910022/opencode2api:latest
    container_name: opencode2api
    ports:
      - "${OPENCODE_PROXY_PORT:-10000}:${OPENCODE_PROXY_PORT:-10000}"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-}
      - OPENCODE_ZEN_API_KEY=${OPENCODE_ZEN_API_KEY:-}
      - API_KEY=${API_KEY:-}
      - BIND_HOST=${BIND_HOST:-${OPENCODE_PROXY_BIND_HOST:-0.0.0.0}}
      - DISABLE_TOOLS=${DISABLE_TOOLS:-true}
      - OPENCODE_DISABLE_TOOLS=${OPENCODE_DISABLE_TOOLS:-}
      - OPENCODE_USE_ISOLATED_HOME=${OPENCODE_USE_ISOLATED_HOME:-false}
      - OPENCODE_PROXY_DEBUG=${OPENCODE_PROXY_DEBUG:-false}
      - OPENCODE_PROXY_PROMPT_MODE=${OPENCODE_PROXY_PROMPT_MODE:-standard}
      - OPENCODE_PROXY_OMIT_SYSTEM_PROMPT=${OPENCODE_PROXY_OMIT_SYSTEM_PROMPT:-false}
      - OPENCODE_PROXY_AUTO_CLEANUP_CONVERSATIONS=${OPENCODE_PROXY_AUTO_CLEANUP_CONVERSATIONS:-false}
      - OPENCODE_PROXY_CLEANUP_INTERVAL_MS=${OPENCODE_PROXY_CLEANUP_INTERVAL_MS:-43200000}
      - OPENCODE_PROXY_CLEANUP_MAX_AGE_MS=${OPENCODE_PROXY_CLEANUP_MAX_AGE_MS:-86400000}
      - OPENCODE_PROXY_REQUEST_TIMEOUT_MS=${OPENCODE_PROXY_REQUEST_TIMEOUT_MS:-180000}
      - OPENCODE_PROXY_RETRY_MAX_RETRIES=${OPENCODE_PROXY_RETRY_MAX_RETRIES:-3}
      - OPENCODE_PROXY_PORT=${OPENCODE_PROXY_PORT:-10000}
      - OPENCODE_SERVER_PORT=${OPENCODE_SERVER_PORT:-10001}
      - OPENCODE_SERVER_URL=${OPENCODE_SERVER_URL:-}
      - OPENCODE_PATH=${OPENCODE_PATH:-opencode}
      - OPENCODE_PROXY_MANAGE_BACKEND=${OPENCODE_PROXY_MANAGE_BACKEND:-false}
      - OPENCODE_EXTERNAL_TOOLS_MODE=${OPENCODE_EXTERNAL_TOOLS_MODE:-proxy-bridge}
      - OPENCODE_EXTERNAL_TOOLS_CONFLICT_POLICY=${OPENCODE_EXTERNAL_TOOLS_CONFLICT_POLICY:-namespace}
      - OPENCODE_INTERNAL_WEB_FETCH_ENABLED=${OPENCODE_INTERNAL_WEB_FETCH_ENABLED:-false}
      - OPENCODE_INTERNAL_ALLOWED_TOOLS=${OPENCODE_INTERNAL_ALLOWED_TOOLS:-}
      - OPENCODE_INTERNAL_TOOL_METRICS_ENABLED=${OPENCODE_INTERNAL_TOOL_METRICS_ENABLED:-true}
      - OPENCODE_TOOL_DISCOVERY_FIXTURE=${OPENCODE_TOOL_DISCOVERY_FIXTURE:-}
      - OPENCODE_HEALTH_DETAILS_ENABLED=${OPENCODE_HEALTH_DETAILS_ENABLED:-true}
      - OPENCODE_HEALTH_DETAILS_REQUIRE_AUTH=${OPENCODE_HEALTH_DETAILS_REQUIRE_AUTH:-true}
      - OPENCODE_METRICS_ENABLED=${OPENCODE_METRICS_ENABLED:-false}
      - OPENCODE_METRICS_REQUIRE_AUTH=${OPENCODE_METRICS_REQUIRE_AUTH:-true}
    volumes:
      - opencode-data:/home/node/.local/share/opencode
      - opencode-config:/home/node/.config/opencode
    restart: unless-stopped
    # Guard small (1GB) hosts: cap memory/CPU so one slow request cannot wedge
    # the whole machine (see docs/host-deployments.md §9). Raw `docker run`
    # hosts should pass the equivalents: --memory=768m --memory-reservation=256m
    # --cpus=1.5 --pids-limit=256.
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.5
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Shallow on purpose: /health needs no auth; /health/details would 401
      # when HEALTH_DETAILS_REQUIRE_AUTH=true and has no credentials here.
      test: ["CMD", "curl", "-f", "http://localhost:${OPENCODE_PROXY_PORT:-10000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Must cover entrypoint backend wait (~180s on cold small hosts) plus
      # probe intervals; 120s flapped unhealthy during normal warmup.
      start_period: 200s

volumes:
  opencode-data:
  opencode-config:
